<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Connexion Admin | Afro Vecteur
</title>

<link rel="stylesheet"
href="css/login.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="login-container">

<div class="login-box">

<div class="logo">

<h1>AFRO<span>VECTEUR</span></h1>

<p>
Espace Administrateur
</p>

</div>

<form id="loginForm">

<div class="input-group">

<i class="fas fa-user"></i>

<input
type="text"
id="username"
placeholder="Nom d'utilisateur"
required>

</div>

<div class="input-group">

<i class="fas fa-lock"></i>

<input
type="password"
id="password"
placeholder="Mot de passe"
required>

</div>

<button type="submit">

Se connecter

</button>

</form>

</div>

</div>

<script src="js/login.js"></script>

</body>
</html>
